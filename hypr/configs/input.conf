input {
    kb_layout = cz
    kb_variant = winkeys
    kb_model =
    kb_options = caps:swapescape
    kb_rules =

    numlock_by_default = true

    follow_mouse = 1

    sensitivity = -0.7 # -1.0 - 1.0, 0 means no modification.

    repeat_rate = 50
    repeat_delay = 300

    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
